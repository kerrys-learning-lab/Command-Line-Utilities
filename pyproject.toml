[project]
name = "command-line-utilities"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "humanize>=4.15.0",
    "markdown-it-py>=4.0.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
]

[project.scripts]
clu = "command_line_utilities.main:main"

[dependency-groups]
dev = [
    "faker>=40.11.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-faker>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Disable the line-too-long rule (E501) and the unused import rule (F401)
ignore = ["E501", "F403"]


[tool.pytest.ini_options]
console_output_style    = "progress"
pythonpath              = "src"
testpaths               = "test"
log_file                = "./.build/test-results/pytest.log"
log_file_level          = "DEBUG"
log_file_format         = "%(asctime)s - %(levelname)-6s - %(name)20s - %(message)s"
log_file_date_format    = "%Y-%m-%d %H:%M:%S"
junit_family            = "xunit2"
junit_suite_name        = "Command Line Utilities"
junit_logging           = "all"
junit_log_passing_tests = true

addopts = [
    "--capture=no",
    "--no-header",
    '--junitxml=./.build/test-results/unit-tests.xml',
    '--cov=command_line_utilities',
    '--cov-report=xml:./.build/test-results/coverage.xml',
    '--cov-report=term',
]
filterwarnings = ["ignore::DeprecationWarning"]
